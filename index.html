<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataFutbolera — Estadísticas de Fútbol</title>
  <meta name="description" content="Estadísticas, tablas y resultados de las principales ligas de fútbol del mundo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Superficies */
      --bg:           #0c0e12;
      --surface-low:  #111317;
      --surface:      #1a1c20;
      --surface-high: #1e2024;
      --surface-top:  #282a2e;

      /* Texto */
      --text:         #e2e2e8;
      --text-muted:   #7a8a8a;
      --text-dim:     #4a5a5a;

      /* Borde */
      --border:       rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);

      /* Acento principal (verde — se sobreescribe por liga) */
      --accent:       #00e476;
      --accent-dim:   rgba(0,228,118,0.12);
      --accent-glow:  0 0 16px rgba(0,228,118,0.25);

      /* Acentos de liga */
      --acc-pl:       #6c2bd9;   /* Premier — purpura */
      --acc-liga:     #e01c33;   /* La Liga — rojo */
      --acc-bund:     #d40000;   /* Bundesliga — carmesí */
      --acc-seriea:   #0099cc;   /* Serie A — azul */
      --acc-ligue1:   #acff00;   /* Ligue 1 — lima */
      --acc-default:  #00e476;   /* resto — verde */

      /* Tipografía */
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Inter', sans-serif;

      /* Radio */
      --r-sm: 4px;
      --r:    6px;
      --r-md: 8px;
      --r-lg: 12px;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
    }

    /* ── SIDEBAR ──────────────────────────────── */
    .sidebar {
      width: 56px;
      background: var(--surface-low);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 4px;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }
    .sidebar-logo {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      padding: 8px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      width: 100%;
      text-align: center;
    }
    .nav-icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-md);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
      font-size: 17px;
    }
    .nav-icon:hover { background: var(--surface-high); color: var(--text); }
    .nav-icon.active { background: var(--accent-dim); color: var(--accent); }
    .sidebar-spacer { flex: 1; }

    /* ── MAIN WRAPPER ─────────────────────────── */
    .main {
      margin-left: 56px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── TOPBAR ───────────────────────────────── */
    .topbar {
      height: 52px;
      background: var(--surface-low);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 90;
    }
    .topbar-brand {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .topbar-nav {
      display: flex;
      gap: 2px;
    }
    .topbar-link {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: var(--r);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .topbar-link:hover { color: var(--text); background: var(--surface-high); }
    .topbar-link.active { color: var(--accent); background: var(--accent-dim); }
    .topbar-spacer { flex: 1; }
    .search-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-wrap input {
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 7px 12px 7px 32px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      width: 220px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap input:focus { border-color: var(--accent); }

    /* ── PAGE CONTENT ─────────────────────────── */
    .page {
      padding: 24px 20px;
      flex: 1;
    }

    /* ── SECCIONES DE LIGAS ───────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 24px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .section-label:first-child { margin-top: 0; }

    /* ── LEAGUE GRID ──────────────────────────── */
    .league-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 4px;
    }
    .league-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 14px 10px 12px;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .league-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--card-accent, var(--accent));
      opacity: 0;
      transition: opacity 0.18s;
    }
    .league-card:hover { border-color: var(--border-hover); background: var(--surface-high); transform: translateY(-1px); }
    .league-card:hover::before { opacity: 1; }
    .league-card.active { border-color: var(--card-accent, var(--accent)); background: var(--surface-high); }
    .league-card.active::before { opacity: 1; }
    .league-flag { font-size: 1.5rem; line-height: 1; }
    .league-name { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .league-sub  { font-size: 10px; color: var(--text-muted); }

    /* ── DETAIL PANEL ─────────────────────────── */
    .detail-panel {
      background: var(--surface-low);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      margin: 16px 0 8px;
      overflow: hidden;
      display: none;
    }
    .detail-panel.open { display: block; }

    /* Cabecera con glow según liga */
    .detail-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .detail-header::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--active-accent, var(--accent));
    }
    .detail-flag {
      font-size: 2rem;
      width: 52px; height: 52px;
      background: var(--surface-top);
      border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .detail-meta { flex: 1; }
    .detail-name {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 1px;
      color: var(--text);
      line-height: 1;
      margin-bottom: 4px;
    }
    .detail-sub { font-size: 12px; color: var(--text-muted); }
    .detail-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--r-sm);
      background: var(--accent-dim);
      color: var(--active-accent, var(--accent));
      border: 1px solid var(--active-accent, var(--accent));
      flex-shrink: 0;
    }

    /* ── TABS ─────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 8px;
    }
    .tab {
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--active-accent, var(--accent)); border-bottom-color: var(--active-accent, var(--accent)); }

    /* ── TAB CONTENT ──────────────────────────── */
    .tab-content { padding: 0; }

    /* Stats pills */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-pill {
      background: var(--surface);
      padding: 14px 16px;
      text-align: center;
    }
    .stat-num {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: var(--active-accent, var(--accent));
      line-height: 1;
    }
    .stat-lbl {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Tabla */
    .table-wrap { overflow-x: auto; padding: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead tr { background: var(--surface-high); }
    th {
      padding: 9px 10px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--text);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.12s; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    .col-pos   { color: var(--text-muted); width: 28px; font-variant-numeric: tabular-nums; }
    .col-team  { font-weight: 600; width: 100%; }
    .col-pts   { font-weight: 700; color: var(--active-accent, var(--accent)); font-variant-numeric: tabular-nums; }
    .col-num   { font-variant-numeric: tabular-nums; color: var(--text-muted); }

    /* Zona lateral en POS */
    .zone-cl .col-pos  { border-left: 3px solid #1a9bfc; padding-left: 7px; }
    .zone-el .col-pos  { border-left: 3px solid #f97316; padding-left: 7px; }
    .zone-rel .col-pos { border-left: 3px solid #e24b4a; padding-left: 7px; }

    /* Leyenda */
    .legend {
      display: flex;
      gap: 14px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface-high);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .legend-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Chips de forma (W/D/L) */
    .form-chips { display: flex; gap: 3px; }
    .chip {
      width: 18px; height: 18px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .chip-w { background: rgba(0,228,118,0.15); color: #00e476; }
    .chip-d { background: rgba(255,185,0,0.15);  color: #ffb900; }
    .chip-l { background: rgba(226,75,74,0.15);  color: #e24b4a; }

    /* Goleadores */
    .scorer-podium {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .scorer-card {
      background: var(--surface);
      padding: 16px;
      position: relative;
    }
    .scorer-card.rank-1 { background: var(--surface-high); }
    .scorer-rank {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .scorer-rank.rank-1 { color: var(--active-accent, var(--accent)); }
    .scorer-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .scorer-team { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
    .scorer-stats { display: flex; gap: 16px; }
    .scorer-stat-val {
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: var(--active-accent, var(--accent));
      line-height: 1;
    }
    .scorer-stat-lbl {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Coming soon */
    .coming-soon {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .coming-soon-icon { font-size: 2rem; margin-bottom: 10px; }

    /* ── FOOTER ───────────────────────────────── */
    .footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 56px;
    }
    .footer-brand { color: var(--accent); font-weight: 600; }
    .footer-status { color: var(--accent); }

    /* ── RESPONSIVE ───────────────────────────── */
    @media (max-width: 600px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .footer { margin-left: 0; }
      .topbar { padding: 0 12px; }
      .topbar-nav { display: none; }
      .search-wrap input { width: 160px; }
      .scorer-podium { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: repeat(3,1fr); }
    }
  </style>
</head>

  /* ── DATOS DE LIGAS ────────────────────────── */

      { id:'seriea',      flag:'🇮🇹', name:'Serie A',          sub:'Italia',          cup:false, accent:'#0099cc' },
      { id:'eredivisie',  flag:'🇳🇱', name:'Eredivisie',       sub:'Países Bajos',    cup:false, accent:'#ff6a00' },

  /* ── DATOS DE EJEMPLO ──────────────────────── */
  const sampleTable = [
    { pos:1,  team:'Manchester City', pj:28, g:20, e:5, p:3,  gf:62, gc:24, dif:'+38', pts:65, zone:'cl',  form:['W','W','W','D','W'] },
    { pos:2,  team:'Arsenal',         pj:28, g:19, e:4, p:5,  gf:58, gc:28, dif:'+30', pts:61, zone:'cl',  form:['W','W','D','W','W'] },
    { pos:3,  team:'Liverpool',       pj:28, g:18, e:5, p:5,  gf:67, gc:35, dif:'+32', pts:59, zone:'cl',  form:['W','D','W','W','L'] },
    { pos:4,  team:'Aston Villa',     pj:28, g:16, e:4, p:8,  gf:55, gc:40, dif:'+15', pts:52, zone:'cl',  form:['W','W','L','W','D'] },

    { pos:19, team:'Burnley',         pj:28, g:4,  e:4, p:20, gf:24, gc:65, dif:'-41', pts:16, zone:'rel', form:['L','L','L','D','L'] },
    { pos:20, team:'Sheffield Utd',   pj:28, g:3,  e:4, p:21, gf:20, gc:72, dif:'-52', pts:13, zone:'rel', form:['L','L','L','L','D'] },

  const sampleScorers = [
    { pos:1, name:'E. Haaland',    team:'Manchester City',  goles:24, asist:7  },
    { pos:2, name:'O. Watkins',    team:'Aston Villa',      goles:19, asist:12 },
    { pos:3, name:'C. Palmer',     team:'Chelsea',          goles:18, asist:9  },
    { pos:4, name:'D. Solanke',    team:'Bournemouth',      goles:16, asist:3  },
    { pos:5, name:'J. Bowen',      team:'West Ham',         goles:13, asist:8  },
    { pos:6, name:'P. Foden',      team:'Manchester City',  goles:12, asist:10 },
    { pos:7, name:'M. Salah',      team:'Liverpool',        goles:11, asist:13 },
  ];

  /* ── ESTADO ────────────────────────────────── */
  let activeLeague = null;
  let activeTab    = 'tabla';

  /* ── HELPERS ───────────────────────────────── */
  function findLeague(id) {
    for (const k of Object.keys(leagues)) {
      const f = leagues[k].find(l => l.id === id);
      if (f) return f;
    }
  }

  /* Renderiza grillas */
  function renderGrid(gridId, arr) {
    const el = document.getElementById(gridId);
    el.innerHTML = arr.map(l => `
      <div class="league-card" id="card-${l.id}"
           style="--card-accent: ${l.accent}"
           onclick="openLeague('${l.id}')">
        <div class="league-flag">${l.flag}</div>
        <div class="league-name">${l.name}</div>
        <div class="league-sub">${l.sub}</div>
      </div>
    `).join('');
  }

  renderGrid('arg-grid', leagues.arg);
  renderGrid('eur-grid', leagues.eur);
  renderGrid('sud-grid', leagues.sud);
  renderGrid('oth-grid', leagues.oth);

  /* Aplica acento de liga al root */
  function applyAccent(accent) {
    document.documentElement.style.setProperty('--active-accent', accent);
    document.documentElement.style.setProperty('--accent-dim', hexToRgba(accent, 0.12));
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  /* ── ABRIR LIGA ────────────────────────────── */
  function openLeague(id) {
    const l = findLeague(id);
    if (!l) return;

    /* Desactivar anterior */
    if (activeLeague) {
      const prev = document.getElementById('card-' + activeLeague);
      if (prev) prev.classList.remove('active');
    }
    document.getElementById('card-' + id).classList.add('active');
    activeLeague = id;

    /* Acento dinámico */
    applyAccent(l.accent);

    /* Cabecera */
    document.getElementById('dFlag').textContent = l.flag;
    document.getElementById('dName').textContent = l.name;
    document.getElementById('dSub').textContent  = l.sub;

    /* Badge */
    const badge = document.getElementById('dBadge');
    badge.textContent = l.cup ? 'Copa' : 'Temporada 24/25';

    /* Mostrar panel */
    const panel = document.getElementById('detailPanel');
    panel.classList.add('open');
    panel.scrollIntoView({ behavior:'smooth', block:'nearest' });

    /* Resetear tabs */
    activeTab = 'tabla';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab')[0].classList.add('active');
    renderTab();
  }

  /* ── CAMBIAR TAB ───────────────────────────── */
  function setTab(el, tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    activeTab = tab;
    renderTab();
  }

  /* ── RENDERIZAR CONTENIDO ──────────────────── */
  function renderTab() {
    const l    = findLeague(activeLeague);
    const wrap = document.getElementById('tabContent');

    if (activeTab === 'tabla') {
      if (l.cup) {
        wrap.innerHTML = `
          <div class="coming-soon">
            <div class="coming-soon-icon">🏆</div>
            Fase de grupos y eliminatorias — próximamente
          </div>`;
        return;
      }

      wrap.innerHTML = `
        <div class="stats-bar">
          <div class="stat-pill"><div class="stat-num">20</div><div class="stat-lbl">Equipos</div></div>
          <div class="stat-pill"><div class="stat-num">28</div><div class="stat-lbl">Jornada</div></div>
          <div class="stat-pill"><div class="stat-num">341</div><div class="stat-lbl">Partidos</div></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:28px">#</th>
                <th>Equipo</th>
                <th>PJ</th><th>G</th><th>E</th><th>P</th>
                <th>GF</th><th>GC</th><th>DIF</th>
                <th>Pts</th>
                <th>Forma</th>
              </tr>
            </thead>
            <tbody>
              ${sampleTable.map(r => `
                <tr class="zone-${r.zone}">
                  <td class="col-pos">${r.pos}</td>
                  <td class="col-team">${r.team}</td>
                  <td class="col-num">${r.pj}</td>
                  <td class="col-num">${r.g}</td>
                  <td class="col-num">${r.e}</td>
                  <td class="col-num">${r.p}</td>
                  <td class="col-num">${r.gf}</td>
                  <td class="col-num">${r.gc}</td>
                  <td class="col-num">${r.dif}</td>
                  <td class="col-pts">${r.pts}</td>
                  <td>
                    <div class="form-chips">
                      ${r.form.map(f => `<div class="chip chip-${f.toLowerCase()}">${f}</div>`).join('')}
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
          <div class="legend">
            <div class="legend-item"><span class="legend-dot" style="background:#1a9bfc"></span>Champions</div>
            <div class="legend-item"><span class="legend-dot" style="background:#f97316"></span>Europa Lg</div>
            <div class="legend-item"><span class="legend-dot" style="background:#e24b4a"></span>Descenso</div>
          </div>
        </div>`;

    } else if (activeTab === 'goleadores') {
      const podium = sampleScorers.slice(0,3);
      const rest   = sampleScorers.slice(3);

      wrap.innerHTML = `
        <div class="scorer-podium">
          ${podium.map((r,i) => `
            <div class="scorer-card ${i===0?'rank-1':''}">
              <div class="scorer-rank ${i===0?'rank-1':''}">
                ${i===0 ? '🥇 Goleador' : i===1 ? '# 2' : '# 3'}
              </div>
              <div class="scorer-name">${r.name}</div>
              <div class="scorer-team">${r.team}</div>
              <div class="scorer-stats">
                <div>
                  <div class="scorer-stat-val">${r.goles}</div>
                  <div class="scorer-stat-lbl">Goles</div>
                </div>
                <div>
                  <div class="scorer-stat-val" style="color:var(--text-muted);font-size:1.3rem">${r.asist}</div>
                  <div class="scorer-stat-lbl">Asist.</div>
                </div>
              </div>
            </div>`).join('')}
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Jugador</th><th>Equipo</th><th>Goles</th><th>Asist.</th></tr>
            </thead>
            <tbody>
              ${rest.map(r => `
                <tr>
                  <td class="col-pos">${r.pos}</td>
                  <td class="col-team">${r.name}</td>
                  <td class="col-num" style="color:var(--text-muted)">${r.team}</td>
                  <td class="col-pts">${r.goles}</td>
                  <td class="col-num">${r.asist}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;

    } else {
      wrap.innerHTML = `
        <div class="coming-soon">
          <div class="coming-soon-icon">📅</div>
          Resultados — sección en construcción
        </div>`;
    }
  }

  /* ── BÚSQUEDA ──────────────────────────────── */
  function handleSearch() {
    const v = document.getElementById('searchInput').value.trim();
    if (v) alert('Búsqueda de "' + v + '" — función próximamente disponible');
  }
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSearch();
  });

  /* ── NAV TOPBAR ────────────────────────────── */
  document.querySelectorAll('.topbar-link').forEach(link => {
    link.addEventListener('click', () => {
      document.querySelectorAll('.topbar-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
    });
  });
</script>
</body>
