<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataFutbolera — Estadísticas de Fútbol</title>
  <meta name="description" content="Estadísticas, tablas y resultados de las principales ligas de fútbol del mundo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1a6b3a;
      --green-light: #22913f;
      --gold: #d4a017;
      --dark: #0f1a14;
      --surface: #162010;
      --card: #1c2a1e;
      --text: #e8f0e9;
      --muted: #8aab8d;
      --border: #2d4a30;
    }
    body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    /* HERO */
    .hero {
      background: linear-gradient(160deg, #0f1a14 0%, #1a3020 60%, #0f1a14 100%);
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px);
    }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 3px; color: #fff; line-height: 1; position: relative; }
    .logo span { color: var(--gold); }
    .tagline { font-size: 1rem; color: var(--muted); margin: 0.5rem 0 1.5rem; letter-spacing: 1px; position: relative; }
    .search-bar { display: flex; gap: 8px; max-width: 480px; margin: 0 auto; position: relative; }
    .search-bar input {
      flex: 1; background: rgba(255,255,255,0.07); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
    }
    .search-bar input::placeholder { color: var(--muted); }
    .search-bar input:focus { border-color: var(--green-light); }
    .search-bar button {
      background: var(--green-light); border: none; border-radius: 8px;
      padding: 10px 18px; color: #fff; font-size: 13px;
      font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer;
    }
    .search-bar button:hover { background: var(--green); }

    /* SECTIONS */
    .section { padding: 1.5rem 1.2rem 0.5rem; }
    .section-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem;
      letter-spacing: 1.5px; color: var(--gold); margin-bottom: 1rem;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* LEAGUE GRID */
    .league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1rem; }
    .league-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; cursor: pointer;
      transition: all 0.18s; display: flex; flex-direction: column;
      align-items: center; gap: 6px; text-align: center;
    }
    .league-card:hover { border-color: var(--green-light); background: #243828; transform: translateY(-2px); }
    .league-card.active { border-color: var(--gold); background: #2a2a18; }
    .league-flag { font-size: 1.6rem; line-height: 1; }
    .league-name { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.3; }
    .league-sub { font-size: 10px; color: var(--muted); }

    /* DETAIL PANEL */
    .detail-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; margin: 0 1.2rem 1.5rem; overflow: hidden; display: none;
    }
    .detail-panel.open { display: block; }
    .detail-header {
      background: var(--card); padding: 1rem 1.2rem;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .detail-header .big-flag { font-size: 2rem; }
    .detail-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 1px; color: #fff; }
    .detail-header p { font-size: 12px; color: var(--muted); }

    /* TABS */
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 10px 16px; font-size: 13px; font-weight: 500;
      color: var(--muted); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* TABLE */
    .table-wrap { padding: 1rem 1.2rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { color: var(--muted); font-weight: 500; padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 8px 8px; border-bottom: 1px solid rgba(45,74,48,0.4); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    .pos { color: var(--muted); width: 24px; }
    .team-name { font-weight: 500; }
    .pts { font-weight: 500; color: var(--gold); }
    .zone-cl td:first-child { border-left: 3px solid #1a9bfc; }
    .zone-el td:first-child { border-left: 3px solid #f97316; }
    .zone-rel td:first-child { border-left: 3px solid #e24b4a; }

    /* STATS BAR */
    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 1rem 1.2rem 0.5rem; }
    .stat-pill { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-pill .num { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--gold); }
    .stat-pill .lbl { font-size: 11px; color: var(--muted); }

    /* COMING SOON */
    .coming-soon { padding: 2rem; text-align: center; color: var(--muted); font-size: 14px; }

    /* LEGEND */
    .legend { padding: 0.8rem 0; display: flex; gap: 1rem; font-size: 11px; color: var(--muted); }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

    /* FOOTER */
    .footer {
      text-align: center; padding: 1.5rem; color: var(--muted);
      font-size: 12px; border-top: 1px solid var(--border); margin-top: 1rem;
    }
  </style>
</head>
<body>

<header class="hero">
  <div class="logo">Data<span>Futbolera</span></div>
  <p class="tagline">Estadísticas · Tablas · Resultados</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar equipo, jugador o liga..." />
    <button onclick="handleSearch()">Buscar</button>
  </div>
</header>

<main>
  <div class="section">
    <div class="section-title">🇦🇷 Argentina</div>
    <div class="league-grid" id="arg-grid"></div>
  </div>
  <div class="section">
    <div class="section-title">🌍 Europa</div>
    <div class="league-grid" id="eur-grid"></div>
  </div>
  <div class="section">
    <div class="section-title">🌎 Sudamérica</div>
    <div class="league-grid" id="sud-grid"></div>
  </div>
  <div class="section">
    <div class="section-title">🌐 Otras ligas</div>
    <div class="league-grid" id="oth-grid"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div class="big-flag" id="dFlag"></div>
      <div>
        <h2 id="dName"></h2>
        <p id="dSub"></p>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="setTab(this,'tabla')">Tabla</div>
      <div class="tab" onclick="setTab(this,'goleadores')">Goleadores</div>
      <div class="tab" onclick="setTab(this,'resultados')">Resultados</div>
    </div>
    <div id="tabContent"></div>
  </div>
</main>

<footer class="footer">
  DataFutbolera &copy; 2025 &middot; Datos con fines informativos &middot;
  <span style="color: var(--green-light);">En construcción 🚀</span>
</footer>

<script>
  const leagues = {
    arg: [
      { id: 'lpf',     flag: '🇦🇷', name: 'Primera División',  sub: 'LPF · Argentina',   cup: false },
      { id: 'bnac',    flag: '🇦🇷', name: 'Primera Nacional',   sub: 'B Nacional · Arg',  cup: false },
      { id: 'bmet',    flag: '🇦🇷', name: 'Primera B Metro',    sub: 'Tercera · Arg',     cup: false },
      { id: 'copa-arg',flag: '🇦🇷', name: 'Copa Argentina',     sub: 'Copa doméstica',    cup: true  },
    ],
    eur: [
      { id: 'pl',      flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', name: 'Premier League',     sub: 'Inglaterra',        cup: false },
      { id: 'liga',    flag: '🇪🇸', name: 'La Liga',            sub: 'España',            cup: false },
      { id: 'ligue1',  flag: '🇫🇷', name: 'Ligue 1',            sub: 'Francia',           cup: false },
      { id: 'bund',    flag: '🇩🇪', name: 'Bundesliga',         sub: 'Alemania',          cup: false },
      { id: 'seriea',  flag: '🇮🇹', name: 'Serie A',            sub: 'Italia',            cup: false },
      { id: 'eredivisie', flag: '🇳🇱', name: 'Eredivisie',      sub: 'Países Bajos',      cup: false },
      { id: 'tsl',     flag: '🇹🇷', name: 'Süper Lig',          sub: 'Turquía',           cup: false },
      { id: 'ucl',     flag: '🇪🇺', name: 'Champions League',   sub: 'UEFA',              cup: true  },
      { id: 'uel',     flag: '🇪🇺', name: 'Europa League',      sub: 'UEFA',              cup: true  },
      { id: 'uecl',    flag: '🇪🇺', name: 'Conference League',  sub: 'UEFA',              cup: true  },
      { id: 'fa',      flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', name: 'FA Cup',             sub: 'Inglaterra',        cup: true  },
      { id: 'coparey', flag: '🇪🇸', name: 'Copa del Rey',       sub: 'España',            cup: true  },
      { id: 'coupefr', flag: '🇫🇷', name: 'Coupe de France',    sub: 'Francia',           cup: true  },
      { id: 'dfbp',    flag: '🇩🇪', name: 'DFB-Pokal',          sub: 'Alemania',          cup: true  },
      { id: 'coppait', flag: '🇮🇹', name: 'Coppa Italia',       sub: 'Italia',            cup: true  },
      { id: 'knvb',    flag: '🇳🇱', name: 'KNVB Beker',         sub: 'Países Bajos',      cup: true  },
      { id: 'tkcup',   flag: '🇹🇷', name: 'Copa Turquía',       sub: 'Turquía',           cup: true  },
    ],
    sud: [
      { id: 'libs',    flag: '🌎', name: 'Copa Libertadores',   sub: 'CONMEBOL',          cup: true  },
      { id: 'suds',    flag: '🌎', name: 'Copa Sudamericana',   sub: 'CONMEBOL',          cup: true  },
    ],
    oth: [
      { id: 'mls',     flag: '🇺🇸', name: 'MLS',                sub: 'Estados Unidos',    cup: false },
      { id: 'uscup',   flag: '🇺🇸', name: 'US Open Cup',        sub: 'EEUU',              cup: true  },
    ]
  };

  const sampleTable = [
    { pos:1,  team:'Manchester City', pj:28, g:20, e:5, p:3,  gf:62, gc:24, pts:65, zone:'cl'  },
    { pos:2,  team:'Arsenal',         pj:28, g:19, e:4, p:5,  gf:58, gc:28, pts:61, zone:'cl'  },
    { pos:3,  team:'Liverpool',       pj:28, g:18, e:5, p:5,  gf:67, gc:35, pts:59, zone:'cl'  },
    { pos:4,  team:'Aston Villa',     pj:28, g:16, e:4, p:8,  gf:55, gc:40, pts:52, zone:'cl'  },
    { pos:5,  team:'Tottenham',       pj:28, g:13, e:6, p:9,  gf:50, gc:44, pts:45, zone:'el'  },
    { pos:6,  team:'Chelsea',         pj:28, g:12, e:7, p:9,  gf:48, gc:42, pts:43, zone:'el'  },
    { pos:7,  team:'Newcastle',       pj:28, g:12, e:6, p:10, gf:46, gc:41, pts:42, zone:''    },
    { pos:8,  team:'Manchester Utd',  pj:28, g:10, e:6, p:12, gf:28, gc:41, pts:36, zone:''    },
    { pos:18, team:'Luton Town',      pj:28, g:6,  e:4, p:18, gf:30, gc:60, pts:22, zone:'rel' },
    { pos:19, team:'Burnley',         pj:28, g:4,  e:4, p:20, gf:24, gc:65, pts:16, zone:'rel' },
    { pos:20, team:'Sheffield Utd',   pj:28, g:3,  e:4, p:21, gf:20, gc:72, pts:13, zone:'rel' },
  ];

  const sampleScorers = [
    { pos:1, name:'Erling Haaland',    team:'Man City',    goles:24, as:7  },
    { pos:2, name:'Ollie Watkins',     team:'Aston Villa', goles:19, as:12 },
    { pos:3, name:'Cole Palmer',       team:'Chelsea',     goles:18, as:9  },
    { pos:4, name:'Dominic Solanke',   team:'Bournemouth', goles:16, as:3  },
    { pos:5, name:'Jarrod Bowen',      team:'West Ham',    goles:13, as:8  },
  ];

  let activeLeague = null;
  let activeTab = 'tabla';

  function findLeague(id) {
    for (const k of Object.keys(leagues)) {
      const f = leagues[k].find(l => l.id === id);
      if (f) return f;
    }
  }

  function renderGrid(gridId, arr) {
    const el = document.getElementById(gridId);
    el.innerHTML = arr.map(l => `
      <div class="league-card" id="card-${l.id}" onclick="openLeague('${l.id}')">
        <div class="league-flag">${l.flag}</div>
        <div class="league-name">${l.name}</div>
        <div class="league-sub">${l.sub}</div>
      </div>
    `).join('');
  }

  renderGrid('arg-grid', leagues.arg);
  renderGrid('eur-grid', leagues.eur);
  renderGrid('sud-grid', leagues.sud);
  renderGrid('oth-grid', leagues.oth);

  function openLeague(id) {
    const l = findLeague(id);
    if (!l) return;
    if (activeLeague) {
      const prev = document.getElementById('card-' + activeLeague);
      if (prev) prev.classList.remove('active');
    }
    const card = document.getElementById('card-' + id);
    if (card) { card.classList.add('active'); }
    activeLeague = id;
    document.getElementById('dFlag').textContent = l.flag;
    document.getElementById('dName').textContent = l.name;
    document.getElementById('dSub').textContent = l.sub;
    document.getElementById('detailPanel').classList.add('open');
    document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    activeTab = 'tabla';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab')[0].classList.add('active');
    renderTab();
  }

  function setTab(el, tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    activeTab = tab;
    renderTab();
  }

  function renderTab() {
    const l = findLeague(activeLeague);
    const wrap = document.getElementById('tabContent');
    if (activeTab === 'tabla') {
      if (l.cup) {
        wrap.innerHTML = `<div class="coming-soon">🏆 Fase de grupos y eliminatorias — próximamente</div>`;
      } else {
        wrap.innerHTML = `
          <div class="stats-bar">
            <div class="stat-pill"><div class="num">20</div><div class="lbl">Equipos</div></div>
            <div class="stat-pill"><div class="num">28</div><div class="lbl">Fecha</div></div>
            <div class="stat-pill"><div class="num">341</div><div class="lbl">Partidos</div></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>Pts</th></tr>
              </thead>
              <tbody>
                ${sampleTable.map(r => `
                  <tr class="zone-${r.zone}">
                    <td class="pos">${r.pos}</td>
                    <td class="team-name">${r.team}</td>
                    <td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td>
                    <td>${r.gf}</td><td>${r.gc}</td>
                    <td class="pts">${r.pts}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
            <div class="legend">
              <span><span class="legend-dot" style="background:#1a9bfc"></span>Champions</span>
              <span><span class="legend-dot" style="background:#f97316"></span>Europa Lg</span>
              <span><span class="legend-dot" style="background:#e24b4a"></span>Descenso</span>
            </div>
          </div>`;
      }
    } else if (activeTab === 'goleadores') {
      wrap.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>Goles</th><th>Asist.</th></tr></thead>
            <tbody>
              ${sampleScorers.map(r => `
                <tr>
                  <td class="pos">${r.pos}</td>
                  <td class="team-name">${r.name}</td>
                  <td style="color:var(--muted)">${r.team}</td>
                  <td class="pts">${r.goles}</td>
                  <td>${r.as}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    } else {
      wrap.innerHTML = `<div class="coming-soon">📅 Resultados — sección en construcción</div>`;
    }
  }

  function handleSearch() {
    const v = document.getElementById('searchInput').value.trim();
    if (v) alert('Búsqueda de "' + v + '" — función próximamente disponible');
  }
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSearch();
  });
</script>
</body>
</html>
